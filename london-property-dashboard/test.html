<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>测试</title>
    <style>
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; }
        .modal.active { display: flex !important; }
        .modal-content { background: white; margin: auto; padding: 20px; border-radius: 8px; }
    </style>
</head>
<body>
    <button onclick="document.getElementById('m').classList.add('active')">测试</button>
    <div id="m" class="modal"><div class="modal-content">成功!</div></div>
</body>
</html>
